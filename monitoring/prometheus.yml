global:
  scrape_interval: 5s
scrape_configs:
  - job_name: endpoints
    metrics_path: /probe
    params:
      module: [tcp]
    static_configs:
      - targets: [host.docker.internal:9380]
        labels: {service: RAGFlow}
      - targets: [host.docker.internal:1234]
        labels: {service: LLM}
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: 'probe:9115'}
